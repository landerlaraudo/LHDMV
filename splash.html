<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="J&L" />
  <title>J&L</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script>
  <style>
    @font-face { font-family: 'NeueHaas'; src: url('fonts/NeueHaasDisplayLight.ttf') format('truetype'); font-weight: 300; font-style: normal; }
    @font-face { font-family: 'NeueHaas'; src: url('fonts/NeueHaasDisplayRoman.ttf') format('truetype'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Europa'; src: url('fonts/EuropaGroteskSH-Lig.otf') format('opentype'); font-weight: 300; font-style: normal; }
    @font-face { font-family: 'Europa'; src: url('fonts/EuropaGroteskSH-Reg.otf') format('opentype'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Europa'; src: url('fonts/EuropaGroteskSH-Med.otf') format('opentype'); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 10% -10%, rgba(255, 187, 149, 0.18), transparent 50%),
        radial-gradient(100% 70% at 90% 0%, rgba(162, 184, 255, 0.14), transparent 45%),
        #f6f6f8;
    }

    /* ── Login ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #ffffff;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.02);
    }

    .splash-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: max(env(safe-area-inset-top), 24px) 32px max(env(safe-area-inset-bottom), 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }

    .splash-title {
      font-family: 'NeueHaas', sans-serif;
      font-weight: 300;
      font-style: normal;
      font-size: clamp(3.2rem, 15vw, 5.5rem);
      color: #0a0a0e;
      line-height: 1.0;
      letter-spacing: -0.02em;
      margin-bottom: 34px;
    }

    .splash-form {
      width: 280px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-input {
      width: 100%;
      height: 46px;
      padding: 0 18px;
      background: #f6f6f8;
      border: 1px solid rgba(0, 0, 0, 0.10);
      border-radius: 22px;
      color: #0a0a0e;
      font-family: 'Europa', sans-serif;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-align: center;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .splash-input:focus {
      border-color: rgba(0, 0, 0, 0.28);
      background: #ffffff;
    }

    .splash-input.shake {
      animation: shake 0.4s ease;
      border-color: #e11d48;
    }

    .splash-btn {
      width: 100%;
      height: 46px;
      margin-top: 12px;
      background: #0a0a0e;
      border: none;
      border-radius: 22px;
      color: #ffffff;
      font-family: 'Europa', sans-serif;
      font-weight: 400;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .splash-btn:active { transform: scale(0.975); }
    .splash-btn:disabled { opacity: 0.4; cursor: default; }

    .splash-error {
      min-height: 18px;
      margin-top: 14px;
      font-family: 'Europa', sans-serif;
      font-weight: 400;
      font-size: 0.76rem;
      color: #e11d48;
      letter-spacing: 0.01em;
    }

    .splash-note {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom), 18px);
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Europa', sans-serif;
      font-weight: 300;
      font-size: 0.62rem;
      color: rgba(0, 0, 0, 0.28);
      letter-spacing: 0.06em;
    }

    /* ── App iframe ── */
    #app {
      opacity: 0;
      transition: opacity 0.8s ease 0.2s;
      height: 100%;
      width: 100%;
    }
    #app.show { opacity: 1; }
    #app iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* ── Escritorio ── */
    @media (min-width: 860px) {
      .splash-title { font-size: 5.5rem; margin-bottom: 44px; }
      .splash-form {
        width: 320px;
        padding: 40px 36px;
        background: #f6f6f8;
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.06);
      }
      .splash-input { background: #ffffff; }
      .splash-note { bottom: 32px; }
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-content">
      <h1 class="splash-title">J&amp;L</h1>

      <form class="splash-form" id="loginForm" autocomplete="off">
        <input
          class="splash-input"
          id="passwordInput"
          type="password"
          inputmode="text"
          placeholder="Contraseña"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        />
        <button class="splash-btn" id="loginBtn" type="submit">Entrar</button>
        <p class="splash-error" id="loginError"></p>
      </form>
    </div>

    <p class="splash-note" id="splashNote"></p>
  </div>

  <div id="app">
    <iframe title="J&L"></iframe>
  </div>

  <script>
    // — Nota inferior con tiempo juntos —
    (function() {
      const start = new Date(2025, 11, 23);
      const now   = new Date();
      let months  = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
      const dayStart = new Date(start.getFullYear(), start.getMonth() + months, start.getDate());
      if (dayStart > now) months--;
      const baseDate = new Date(start.getFullYear(), start.getMonth() + months, start.getDate());
      const days = Math.floor((now - baseDate) / 86400000);
      let t = '';
      if (months > 0) t += `${months} mes${months > 1 ? 'es' : ''}`;
      if (months > 0 && days > 0) t += ' y ';
      if (days > 0 || months === 0) t += `${days} día${days !== 1 ? 's' : ''}`;
      document.getElementById('splashNote').textContent = `J&L · juntos desde hace ${t}`;
    })();

    // — Login con contraseña (hash SHA-256, sin backend) —
    (function() {
      const PASSWORD_HASH = '7898a191c038ab1cba4336d12dc3f19f86f30c0a6027e71e2f4bf3c07e4912d8';
      const UNLOCK_KEY     = 'lhdmv_unlocked';
      const FAILS_KEY      = 'lhdmv_login_fails';
      const LOCK_KEY       = 'lhdmv_login_lock_until';
      const MAX_ATTEMPTS   = 5;
      const LOCK_MS        = 60000; // 60s de bloqueo tras agotar intentos

      const splash    = document.getElementById('splash');
      const app       = document.getElementById('app');
      const form      = document.getElementById('loginForm');
      const input     = document.getElementById('passwordInput');
      const btn       = document.getElementById('loginBtn');
      const errorEl   = document.getElementById('loginError');

      function unlockApp() {
        const iframe = app.querySelector('iframe');
        if (!iframe.src) iframe.src = 'index.html';
        splash.classList.add('hide');
        app.classList.add('show');
        setTimeout(() => { splash.style.display = 'none'; }, 650);
      }

      // Ya desbloqueado en este dispositivo — entra directo, sin mostrar el login
      if (localStorage.getItem(UNLOCK_KEY) === '1') {
        splash.style.transition = 'none';
        unlockApp();
        return;
      }

      async function sha256Hex(text) {
        const data = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(digest))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
      }

      function msLockRemaining() {
        const until = parseInt(localStorage.getItem(LOCK_KEY) || '0', 10);
        return until - Date.now();
      }

      function applyLockUI() {
        const remaining = msLockRemaining();
        if (remaining <= 0) {
          btn.disabled = false;
          input.disabled = false;
          errorEl.textContent = '';
          return;
        }
        btn.disabled = true;
        input.disabled = true;
        const tick = () => {
          const left = msLockRemaining();
          if (left <= 0) {
            btn.disabled = false;
            input.disabled = false;
            errorEl.textContent = '';
            localStorage.removeItem(FAILS_KEY);
            localStorage.removeItem(LOCK_KEY);
            return;
          }
          errorEl.textContent = `Demasiados intentos. Espera ${Math.ceil(left / 1000)}s`;
          setTimeout(tick, 1000);
        };
        tick();
      }

      applyLockUI();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (msLockRemaining() > 0) return;

        const value = input.value;
        if (!value) return;

        const hash = await sha256Hex(value);
        if (hash === PASSWORD_HASH) {
          localStorage.setItem(UNLOCK_KEY, '1');
          localStorage.removeItem(FAILS_KEY);
          localStorage.removeItem(LOCK_KEY);
          unlockApp();
          return;
        }

        input.value = '';
        input.classList.remove('shake');
        void input.offsetWidth;
        input.classList.add('shake');

        const fails = parseInt(localStorage.getItem(FAILS_KEY) || '0', 10) + 1;
        localStorage.setItem(FAILS_KEY, String(fails));

        if (fails >= MAX_ATTEMPTS) {
          localStorage.setItem(LOCK_KEY, String(Date.now() + LOCK_MS));
          localStorage.setItem(FAILS_KEY, '0');
          applyLockUI();
        } else {
          errorEl.textContent = 'Contraseña incorrecta';
        }
      });
    })();
  </script>

</body>
</html>
